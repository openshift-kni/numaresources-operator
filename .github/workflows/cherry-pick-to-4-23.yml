# Selectively request cherry-picks from release-5.0 to release-4.23.
#
# PRs that only change dependency-management or branch-specific files are
# skipped. If a PR also changes other files, it is cherry-picked as a whole,
# including any excluded paths in that mixed PR.

name: Cherry-pick to release-4.23

on:
  pull_request:
    types:
      - closed
    branches:
      - release-5.0

permissions:
  pull-requests: write

jobs:
  cherry-pick:
    name: Evaluate and cherry-pick to release-4.23
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check for backportable changes and post cherry-pick comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            console.log(`Evaluating PR #${prNumber} for cherry-pick to release-4.23`);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            console.log(`PR #${prNumber} changed ${files.length} file(s)`);

            // PRs that only touch these paths are skipped. If other files are
            // also changed, Prow cherry-picks the complete PR, including these
            // paths, matching the selective-backport policy used upstream.
            const excludedPatterns = [
              /^go\.(mod|sum)$/,
              /^vendor\//,
              /^\.tekton\//,
              /^\.konflux\//,
              /^\.mintmaker\//,
              /^\.github\/workflows\//,
              /^renovate\.json$/,
              /^bundle\//,
              /^catalog\//,
              /(^|\/)OWNERS(?:_ALIASES)?$/,
            ];

            function isExcluded(filePath) {
              return excludedPatterns.some((pattern) => pattern.test(filePath));
            }

            if (files.length === 0) {
              console.log('No changed files were returned. Skipping cherry-pick.');
              return;
            }

            const backportableFiles = files.filter((file) =>
              [file.filename, file.previous_filename]
                .filter(Boolean)
                .some((filePath) => !isExcluded(filePath))
            );

            if (backportableFiles.length === 0) {
              console.log('All changed files are excluded (dependency or branch-specific only). Skipping cherry-pick.');
              files.forEach((file) => console.log(`  ✗ ${file.filename}`));
              return;
            }

            console.log(`Found ${backportableFiles.length} non-excluded file(s):`);
            backportableFiles.forEach((file) => console.log(`  ✓ ${file.filename}`));

            const cherryPickCommand = '/cherry-pick release-4.23';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const alreadyPosted = comments.some((comment) =>
              comment.body
                .split(/\r?\n/)
                .some((line) => line.trim() === cherryPickCommand)
            );

            if (alreadyPosted) {
              console.log(`Cherry-pick command already exists on PR #${prNumber}. Skipping.`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: cherryPickCommand,
            });

            console.log(`Posted "${cherryPickCommand}" on PR #${prNumber}`);
