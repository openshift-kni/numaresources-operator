# Selectively request cherry-picks from release-5.0 to release-4.23.
#
# Prow cherry-picks the merged PR's commits as a whole. Therefore, skip the
# entire PR if it changes any branch-specific or dependency-management files;
# otherwise those files would be carried along with the code change.
# Mixed PRs can still be backported manually after reviewing their contents.

name: Cherry-pick to release-4.23

on:
  pull_request:
    types:
      - closed
    branches:
      - release-5.0

permissions:
  pull-requests: write

jobs:
  cherry-pick:
    name: Evaluate and cherry-pick to release-4.23
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check for backportable changes and post cherry-pick comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            console.log(`Evaluating PR #${prNumber} for cherry-pick to release-4.23`);

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            console.log(`PR #${prNumber} changed ${files.length} file(s)`);

            // These files are generated, branch-specific, or dependency inputs.
            // The Prow command cherry-picks the complete PR, so do not trigger
            // automatically when any of these paths occur, even in a mixed PR.
            const excludedPatterns = [
              /^go\.(mod|sum)$/,
              /^vendor\//,
              /^\.tekton\//,
              /^\.konflux\//,
              /^\.mintmaker\//,
              /^\.github\/workflows\//,
              /^renovate\.json$/,
              /^bundle\//,
              /^catalog\//,
              /(^|\/)OWNERS(?:_ALIASES)?$/,
            ];

            function isExcluded(filePath) {
              return excludedPatterns.some((pattern) => pattern.test(filePath));
            }

            const excludedFiles = files.filter((file) =>
              [file.filename, file.previous_filename]
                .filter(Boolean)
                .some(isExcluded)
            );

            if (files.length === 0) {
              console.log('No changed files were returned. Skipping cherry-pick.');
              return;
            }

            if (excludedFiles.length > 0) {
              console.log('Found branch-specific or dependency-management changes; skipping the whole PR:');
              excludedFiles.forEach((file) => {
                console.log(`  ✗ ${file.filename}`);
              });
              return;
            }

            const cherryPickCommand = '/cherry-pick release-4.23';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const alreadyPosted = comments.some((comment) =>
              comment.body
                .split(/\r?\n/)
                .some((line) => line.trim() === cherryPickCommand)
            );

            if (alreadyPosted) {
              console.log(`Cherry-pick command already exists on PR #${prNumber}. Skipping.`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: cherryPickCommand,
            });

            console.log(`Posted "${cherryPickCommand}" on PR #${prNumber}`);
