---
# Bundles in this catalog already use registry.redhat.io pullspecs.
# Kept so the FBC pipeline IDMS rewrite step has a file to consume.
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: catalog-idms
spec:
  imageDigestMirrors:
  - mirrors:
    - quay.io/redhat-user-workloads/telco-5g-tenant/numaresources-operator-bundle-4-22
    source: registry.redhat.io/openshift4/numaresources-operator-bundle
