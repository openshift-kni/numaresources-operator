apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: numazone
allowPrivilegedContainer: true
allowHostDirVolumePlugin: true
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: RunAsAny
fsGroup:
  type: RunAsAny
supplementalGroups:
  type: RunAsAny
users: []
volumes:
- hostPath
- projected
