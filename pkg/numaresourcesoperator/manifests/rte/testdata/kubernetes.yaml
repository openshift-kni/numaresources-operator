---
apiVersion: v1
data:
  config.yaml: |
    topologyManagerPolicy: single-numa-node
kind: ConfigMap
metadata:
  name: rte-config
  namespace: test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-rte
  namespace: test
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-rte
  namespace: test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rte
subjects:
- kind: ServiceAccount
  name: rte
  namespace: rendered
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: test-rte
rules:
- apiGroups:
  - topology.node.k8s.io
  resources:
  - noderesourcetopologies
  verbs:
  - create
  - update
  - get
  - list
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - watch
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: test-rte
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rte
subjects:
- kind: ServiceAccount
  name: rte
  namespace: test
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: test-rte
  namespace: test
spec:
  selector:
    matchLabels:
      name: resource-topology
  template:
    metadata:
      labels:
        name: resource-topology
    spec:
      containers:
      - args:
        - --sleep-interval=10s
        - --sysfs=/host-sys
        - --podresources-socket=unix:///host-podresources/kubelet.sock
        - -v=2
        - --notify-file=/host-run-rte/notify
        - --pods-fingerprint=true
        - --kubelet-config-file=/host-var-lib-kubelet/config.yaml
        command:
        - /bin/resource-topology-exporter
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: REFERENCE_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REFERENCE_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: REFERENCE_CONTAINER_NAME
          value: shared-pool-container
        - name: METRICS_PORT
          value: "2112"
        image: test/rte:copy
        imagePullPolicy: IfNotPresent
        name: resource-topology-exporter
        ports:
        - containerPort: 2112
          name: metrics-port
        resources: {}
        volumeMounts:
        - mountPath: /host-sys
          name: host-sys
          readOnly: true
        - mountPath: /host-podresources
          name: host-podresources
          readOnly: true
        - mountPath: /etc/resource-topology-exporter/
          name: rte-config-volume
        - mountPath: /host-run-rte
          name: host-run-rte
        - mountPath: /host-var-lib-kubelet
          name: host-var-lib-kubelet
          readOnly: true
      - image: gcr.io/google_containers/pause-amd64:3.0
        name: shared-pool-container
        resources: {}
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      priorityClassName: system-node-critical
      readinessGates:
      - conditionType: PodresourcesFetched
      - conditionType: NodeTopologyUpdated
      serviceAccountName: rte
      volumes:
      - hostPath:
          path: /sys
          type: Directory
        name: host-sys
      - hostPath:
          path: /var/lib/kubelet/pod-resources
          type: Directory
        name: host-podresources
      - configMap:
          name: rte-config
          optional: true
        name: rte-config-volume
      - hostPath:
          path: /run/rte
          type: DirectoryOrCreate
        name: host-run-rte
      - hostPath:
          path: /var/lib/kubelet
          type: Directory
        name: host-var-lib-kubelet
  updateStrategy: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-rte
  namespace: rendered
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-rte
  namespace: test
spec:
  podSelector:
    matchLabels:
      name: resource-topology
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-rte
  namespace: test
spec:
  egress:
  - ports:
    - port: 6443
      protocol: TCP
  podSelector:
    matchLabels:
      name: resource-topology
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-rte
  namespace: test
spec:
  ingress:
  - ports:
    - port: 2112
      protocol: TCP
  podSelector:
    matchLabels:
      name: resource-topology
  policyTypes:
  - Ingress
