apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift-kni/numaresources-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # Local custom task only; git-clone comes from the Konflux catalog via bundles
    pipelinesascode.tekton.dev/task: "[tasks/update-scheduler-digests.yaml]"
    # On-demand only: comment /update-scheduler-digests on a PR, or on a
    # commit on main. The task no-ops when digests are unchanged.
    pipelinesascode.tekton.dev/on-comment: "^/update-scheduler-digests$"
    # FOR TESTING ONLY: Uncomment the below to test the pipeline on updates. **DO NOT MERGE** the uncommented version.
    # pipelinesascode.tekton.dev/on-cel-expression: |
    #   event == "pull_request" &&
    #   target_branch == "main" &&
    #   ("tasks/update-scheduler-digests.yaml".pathChanged() ||
    #   ".tekton/update-scheduler-digests-pipeline.yaml".pathChanged())
  creationTimestamp: null
  name: update-scheduler-digests
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: target-branch
    value: '{{target_branch}}'
  timeouts:
    pipeline: 1h0m0s
  # Required for Konflux catalog git-clone (runs as root / appstudio-pipelines-scc)
  taskRunTemplate:
    serviceAccountName: build-pipeline-numaresources-operator-5-0
  workspaces:
  - name: source-workspace
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
  - name: pull-secret
    secret:
      secretName: telco-5g-redhat-pull-secret
  pipelineSpec:
    params:
    - name: git-url
      type: string
    - name: revision
      type: string
    - name: target-branch
      type: string
      default: main
    workspaces:
    - name: source-workspace
    - name: git-auth
    - name: pull-secret
    tasks:
    - name: clone-repository
      taskRef:
        params:
        - name: name
          value: git-clone
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-git-clone:0.2@sha256:4ba6a13721fc5e7258d2ca6a0bed0dae9be5548691c691cb5eb36aea5ac62136
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: output
        workspace: source-workspace
      - name: basic-auth
        workspace: git-auth
      params:
      - name: url
        value: $(params.git-url)
      - name: revision
        value: $(params.revision)
      # Konflux git-clone defaults subdirectory to "source"; empty keeps the
      # checkout at the workspace root for the following make task.
      - name: subdirectory
        value: ""
    - name: run-update-scheduler-digests
      runAfter:
      - clone-repository
      taskRef:
        name: update-scheduler-digests
      workspaces:
      - name: source
        workspace: source-workspace
      - name: basic-auth
        workspace: git-auth
      - name: pull-secret
        workspace: pull-secret
      params:
      - name: repo-url
        value: https://api.github.com/repos/openshift-kni/numaresources-operator
      - name: target-branch
        value: $(params.target-branch)
status: {}
