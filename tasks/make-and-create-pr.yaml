apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: make-and-create-pr
spec:
  workspaces:
    - name: source
    - name: basic-auth 
  params:
    - name: target-branch
      default: "main"
    - name: repo-url
  steps:
    - name: run-make-and-push
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest 
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -euo pipefail

        GITHUB_TOKEN="$(cat "$(workspaces.basic-auth.path)/git-provider-token")"

        # 1. Run your make target
        make update-scheduler-digests

        # 2. Check if there are any generated changes
        if git diff --quiet; then
          echo "No changes generated by make. Exiting."
          exit 0
        fi

        # 3. Reuse (or create) the bot branch, commit, and push
        NEW_BRANCH="update-sched-digests-main"
        git checkout -B "$NEW_BRANCH"
        git add .
        git commit -s -m "New scheduler images are detected in the production registry. Update the embedded digests JSON file to reflect the latest version."

        # The basic-auth workspace automatically configures git-credentials.
        # Force-push is intentional: this task owns the bot branch and must
        # overwrite prior runs without non-fast-forward failures.
        git push --force origin "$NEW_BRANCH"

        # 4. Open a PR only if one for this head/base is not already open
        REPO_API="$(params.repo-url)"
        OWNER="${REPO_API#*repos/}"
        OWNER="${OWNER%%/*}"
        TARGET_BRANCH="$(params.target-branch)"
        EXISTING_PRS=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" \
             -H "Accept: application/vnd.github.v3+json" \
             "${REPO_API}/pulls?head=${OWNER}:${NEW_BRANCH}&base=${TARGET_BRANCH}&state=open")
        if echo "$EXISTING_PRS" | grep -q '"number"'; then
          echo "Open PR for ${NEW_BRANCH} already exists; branch updated in place."
        else
          curl -fsS -X POST -H "Authorization: token $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               "${REPO_API}/pulls" \
               -d '{"title":"chore: update embedded scheduler images digests JSON file", "head":"'"$NEW_BRANCH"'", "base":"'"$TARGET_BRANCH"'"}'
        fi