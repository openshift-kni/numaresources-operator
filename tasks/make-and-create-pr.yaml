apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: make-and-create-pr
spec:
  description: >
    Refresh embedded scheduler digests via make update-scheduler-digests,
    then force-push a bot branch and open/update a pull request when the
    digests file changes.
  workspaces:
  - name: source
  - name: basic-auth
  params:
  - name: target-branch
    type: string
    default: main
  - name: repo-url
    type: string
    description: GitHub API repo URL (https://api.github.com/repos/org/repo)
  steps:
  - name: run-make-and-push
    # Publicly pullable step image (brew.registry.redhat.io is not available to Pac Task pods)
    image: registry.access.redhat.com/ubi9/go-toolset:1.24
    workingDir: $(workspaces.source.path)
    securityContext:
      runAsUser: 0
    env:
    - name: HOME
      value: /tekton/home
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      if ! command -v skopeo >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1 || ! command -v git >/dev/null 2>&1 || ! command -v make >/dev/null 2>&1; then
        dnf install -y skopeo curl git make
      fi

      # go.mod may require a newer toolchain than the image provides
      export GOTOOLCHAIN=auto

      GITHUB_TOKEN="$(cat "$(workspaces.basic-auth.path)/git-provider-token")"

      make update-scheduler-digests

      DIGESTS_FILE="internal/api/scheduler/_digests.json"
      if git diff --quiet -- "$DIGESTS_FILE"; then
        echo "No changes generated by make. Exiting."
        exit 0
      fi

      git config user.name "numaresources-operator-bot"
      git config user.email "numaresources-operator-bot@users.noreply.github.com"
      git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/openshift-kni/numaresources-operator.git"

      NEW_BRANCH="update-sched-digests-main"
      git checkout -B "$NEW_BRANCH"
      git add -- "$DIGESTS_FILE"
      git commit -s -m "chore: update embedded scheduler image digests"

      # Force-push is intentional: this task owns the bot branch and must
      # overwrite prior runs without non-fast-forward failures.
      git push --force origin "$NEW_BRANCH"

      REPO_API="$(params.repo-url)"
      OWNER="${REPO_API#*repos/}"
      OWNER="${OWNER%%/*}"
      TARGET_BRANCH="$(params.target-branch)"
      EXISTING_PRS=$(curl -sS -H "Authorization: token ${GITHUB_TOKEN}" \
           -H "Accept: application/vnd.github.v3+json" \
           "${REPO_API}/pulls?head=${OWNER}:${NEW_BRANCH}&base=${TARGET_BRANCH}&state=open")
      if echo "$EXISTING_PRS" | grep -q '"number"'; then
        echo "Open PR for ${NEW_BRANCH} already exists; branch updated in place."
      else
        curl -fsS -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
             -H "Accept: application/vnd.github.v3+json" \
             "${REPO_API}/pulls" \
             -d '{"title":"chore: update embedded scheduler images digests JSON file","head":"'"${NEW_BRANCH}"'","base":"'"${TARGET_BRANCH}"'"}'
      fi
